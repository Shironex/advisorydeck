# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: nodejs
name: Node.js
category: runtimes
homepage: https://nodejs.org
description: JavaScript runtime, the node images most JavaScript apps run on.
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: nodejs
images:
  - ref: docker.io/library/node
    tag_pattern: "^(?<version>[0-9]+(?:\\.[0-9]+){0,2})(?:-(?:alpine[0-9.]*|trixie|bookworm|bullseye|slim|trixie-slim|bookworm-slim|bullseye-slim))?$"
    note: Codename tags (jod, krypton, lts) float and carry no number; 22-alpine is the 22 line and maps to its endoflife.date branch. Alpha and nightly tags are not read.
sources:
  - type: cve-cna
    assigner: openjs
    vendor: nodejs
    products: [node]
    note: The OpenJS Foundation files Node.js CVEs since 2026.
  - type: cve-cna
    assigner: hackerone
    vendor: nodejs
    products: [node]
    note: Older Node.js CVEs were filed through hackerone.
  - type: vendor-page
    url: https://nodejs.org/en/blog/vulnerability
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - OpenJS records give one bounded range per line, each starting where the previous line ends (0.0.0 lessThan 22.23.5, 23.0.0 lessThan 24.22.3), so end of life lines in between stay affected.
  - hackerone records list each line as introduced equal to last affected (22.23.3 lessThanOrEqual 22.23.3); with two or more such lines ingest reads them as every version up to each, per line.
  - The runtime inside an app image is what matters; check node --version in the container when the image is not a node tag.
