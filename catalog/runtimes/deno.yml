# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: deno
name: Deno
category: runtimes
homepage: https://deno.com
description: JavaScript and TypeScript runtime.
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: deno
images:
  - ref: docker.io/denoland/deno
    tag_pattern: "^(?:(?:alpine|debian|ubuntu|distroless|bin)-)?(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
    note: The variant comes before the version (alpine-2.9.8); variant tags without a number carry no version.
sources:
  - type: ghsa-repo
    repo: denoland/deno
    packages: [deno, '', denoland/deno]
    note: Entries for the deno_runtime crate and other crates have their own versions and are not read.
  - type: cve-cna
    assigner: GitHub_M
    vendor: denoland
    products: [deno]
  - type: cve-cna
    assigner: VulnCheck
    vendor: denoland
    products: [deno]
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Repository advisories name deno under the rust, deno or no ecosystem with the release versions; a bare version next to a later patch (2.7.14, patched 2.8.0) is read as every version before the patch.
