# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: bun
name: Bun
category: runtimes
homepage: https://bun.sh
description: JavaScript runtime, bundler and package manager.
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: bun
images:
  - ref: docker.io/oven/bun
    tag_pattern: "^(?<version>[0-9]+(?:\\.[0-9]+){0,2})(?:-(?:alpine|slim|debian|distroless))?$"
    note: canary and variant tags without a number carry no version.
sources:
  - type: ghsa-repo
    repo: oven-sh/bun
  - type: ghsa-package
    ecosystem: npm
    package: bun
  - type: cve-cna
    assigner: mitre
    vendor: Bun
    products: [Bun]
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Repository advisories name the npm package bun, whose versions are the release versions.
  - Few advisories a year.
