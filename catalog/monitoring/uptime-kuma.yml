# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: uptime-kuma
name: Uptime Kuma
category: monitoring
homepage: https://uptime.kuma.pet
description: Self-hosted uptime monitoring with status pages.
version_scheme: semver
branches:
  source: none
images:
  - ref: docker.io/louislam/uptime-kuma
    tag_pattern: "^(?<version>[0-9]+(?:\\.[0-9]+){0,2}(?:-beta\\.[0-9]+)?)(?:-(?:alpine|debian))?(?:-slim)?(?:-rootless)?$"
    note: next, nightly and base tags carry no release version.
sources:
  - type: ghsa-repo
    repo: louislam/uptime-kuma
  - type: cve-cna
    assigner: GitHub_M
    vendor: louislam
    products: [uptime-kuma]
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Repository advisories name uptime-kuma with an empty, other or npm ecosystem.
  - GHSA-98hr-q8q8-5j23 names its package "Rootless Docker Image only" because it affects only the rootless image; the catalog cannot tell image variants apart, so it is reported for every image of the affected versions.
  - Some ranges join bounds with && (>= 2.0.0 && <= 2.1.3), which cannot be read (published as unknown).
  - Not listed on endoflife.date.
