# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: netdata
name: Netdata
category: monitoring
homepage: https://www.netdata.cloud
description: Real-time infrastructure monitoring agent.
version_scheme: semver
branches:
  source: none
images:
  - ref: docker.io/netdata/netdata
    tag_pattern: "^v(?<version>[0-9]+(?:\\.[0-9]+){0,2})$"
    note: stable, edge and latest carry no version.
sources:
  - type: ghsa-repo
    repo: netdata/netdata
    packages: [netdata, '', ndsudo]
    note: Entries for the Windows installer (netdata-x64.msi) do not apply to the image and are not read.
  - type: cve-cna
    assigner: GitHub_M
    vendor: netdata
    products: [netdata]
  - type: cve-cna
    assigner: VulnCheck
    vendor: netdata
    products: [netdata]
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Ranges name the stable release and the nightly build together (< v2.10.4, < v2.10.0-782-nightly); the nightly bound has no effect on stable versions.
  - Not listed on endoflife.date.
