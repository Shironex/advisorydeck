# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: dozzle
name: Dozzle
category: monitoring
homepage: https://dozzle.dev
description: Web viewer for Docker container logs.
version_scheme: semver
branches:
  source: none
images:
  - ref: docker.io/amir20/dozzle
    tag_pattern: "^v(?<version>[0-9]+(?:\\.[0-9]+){0,2})(?:-alpine)?$"
    note: main, pr- and latest tags carry no version.
sources:
  - type: cve-cna
    assigner: GitHub_M
    vendor: amir20
    products: [dozzle]
    note: Listed first because some repository advisories name a whole major (v10) where the CVE record gives the fix.
  - type: ghsa-repo
    repo: amir20/dozzle
  - type: ghsa-package
    ecosystem: go
    package: github.com/amir20/dozzle
  - type: cve-cna
    assigner: VulnCheck
    vendor: amir20
    products: [dozzle]
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Many repository advisories give an upper bound with no patched version (<= v11.2.0); they are published with no fix. Some ranges are prose (<=v11.1.1 (the latest release), >= 8.5.0) or a major with an x (<= 8.x) and cannot be read.
  - Not listed on endoflife.date.
