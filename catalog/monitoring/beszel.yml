# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: beszel
name: Beszel
category: monitoring
homepage: https://beszel.dev
description: Lightweight server monitoring hub and agent.
version_scheme: semver
branches:
  source: none
images:
  - ref: docker.io/henrygd/beszel
    tag_pattern: "^(?<version>[0-9]+(?:\\.[0-9]+){0,2})(?:-alpine)?$"
    note: latest, edge and dev carry no version.
  - ref: docker.io/henrygd/beszel-agent
    tag_pattern: "^(?<version>[0-9]+(?:\\.[0-9]+){0,2})(?:-alpine)?$"
    note: The hub and the agent share version numbers.
sources:
  - type: ghsa-repo
    repo: henrygd/beszel
  - type: ghsa-package
    ecosystem: go
    package: github.com/henrygd/beszel
  - type: cve-cna
    assigner: GitHub_M
    vendor: henrygd
    products: [beszel]
  - type: cve-cna
    assigner: VulnCheck
    vendor: henrygd
    products: [beszel]
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Advisories name the Go module github.com/henrygd/beszel, whose versions are the release versions.
  - Not listed on endoflife.date.
  - GHSA-wqvf-7262-m7g8 writes <= 1.19.0 for a fix in 0.20.0; corrections/beszel holds its hand correction.
