# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: loki
name: Grafana Loki
category: monitoring
homepage: https://grafana.com/oss/loki/
description: Log aggregation system.
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: grafana-loki
images:
  - ref: docker.io/grafana/loki
    tag_pattern: "^(?<version>[0-9]+(?:\\.[0-9]+){0,2})(?:-(?:amd64|arm64|arm))?$"
    note: main- and k- tags are development builds and carry no version.
sources:
  - type: cve-cna
    assigner: GRAFANA
    products: [Loki]
    note: The Grafana CNA files every Grafana Labs product and plugin; the product name keeps only Loki.
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Records carry a leading v (v3.0.0 lessThan v3.7.0); it is dropped.
  - Few advisories a year.
