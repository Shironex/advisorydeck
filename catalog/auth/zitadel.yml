# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: zitadel
name: ZITADEL
category: auth
homepage: https://zitadel.com
description: Identity and access management with OIDC, SAML and passkeys.
version_scheme: semver
branches:
  source: none
images:
  - ref: ghcr.io/zitadel/zitadel
    tag_pattern: "^v(?<version>[0-9]+\\.[0-9]+\\.[0-9]+(?:-rc\\.[0-9]+)?)(?:-(?:amd64|arm64|debug))?$"
    note: Commit and preview tags carry no release version.
sources:
  - type: ghsa-repo
    repo: zitadel/zitadel
  - type: cve-cna
    assigner: GitHub_M
    vendor: zitadel
    products: [zitadel]
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Repository advisories name the product ZITADEL under the ecosystem zitadel or other; Go module entries (github.com/zitadel/zitadel) carry module versions and are not read when a product entry exists.
  - Many advisories have no CVE id.
  - Not listed on endoflife.date.
