# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: vaultwarden
name: Vaultwarden
category: auth
homepage: https://github.com/dani-garcia/vaultwarden
description: Lightweight Bitwarden-compatible password manager server.
version_scheme: semver
branches:
  source: none
images:
  - ref: docker.io/vaultwarden/server
    tag_pattern: "^(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)(?:-alpine)?$"
    note: latest, alpine and testing carry no release version.
sources:
  - type: ghsa-repo
    repo: dani-garcia/vaultwarden
  - type: ghsa-package
    ecosystem: rust
    package: vaultwarden
  - type: cve-cna
    assigner: GitHub_M
    vendor: dani-garcia
    products: [vaultwarden]
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Repository advisories name the crate vaultwarden (rust) or vaultwarden with an empty ecosystem; the crate versions are the release versions.
  - Ranges are written with and without a space after the operator (<=1.37.3).
  - About half of the advisories have no CVE id.
  - Not listed on endoflife.date.
