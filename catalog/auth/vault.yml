# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: vault
name: HashiCorp Vault
category: auth
homepage: https://www.vaultproject.io
description: Secrets management (Vault Community Edition).
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: hashicorp-vault
images:
  - ref: docker.io/hashicorp/vault
    tag_pattern: "^(?<version>[0-9]+(?:\\.[0-9]+){0,2}(?:-rc[0-9]+)?)$"
    note: latest carries no version.
sources:
  - type: cve-cna
    assigner: HashiCorp
    products: [Vault]
    note: HashiCorp is its own CNA. Vault Enterprise is filed under its own product name with backported fixes and is not this product.
  - type: vendor-page
    url: https://discuss.hashicorp.com/c/security
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Records give one range from the first affected release to the fix in the current line (1.10.0 lessThan 2.2.2); the Community Edition only gets fixes in its newest line.
  - Vault is under the Business Source License since 1.15; OpenBao is the open source fork.
