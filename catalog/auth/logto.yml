# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: logto
name: Logto
category: auth
homepage: https://logto.io
description: Identity platform with single sign-on (OIDC, OAuth 2.1, SAML).
version_scheme: semver
branches:
  source: none
images:
  - ref: docker.io/svhd/logto
    tag_pattern: "^(?<version>[0-9]+(?:\\.[0-9]+){0,2})$"
    note: edge and latest carry no version.
sources:
  - type: ghsa-repo
    repo: logto-io/logto
    packages: ['@logto/core', logto-io/logto, logto]
    note: Entries for the connectors, @logto/tunnel and other packages with their own versions are not read.
  - type: cve-cna
    assigner: GitHub_M
    vendor: logto-io
    products: [logto]
  - type: cve-cna
    assigner: certcc
    vendor: Logto
    products: [Logto]
  - type: cve-cna
    assigner: VulnCheck
    vendor: logto-io
    products: [logto]
    note: VulnCheck files CVEs for repository advisories that have none; their references link the GHSA, so they join it as one advisory.
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Repository advisories name the npm package @logto/core, whose versions are the release versions (1.46.0), or the repository itself (logto-io/logto).
  - Not listed on endoflife.date.
