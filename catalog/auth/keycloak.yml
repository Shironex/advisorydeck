# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: keycloak
name: Keycloak
category: auth
homepage: https://www.keycloak.org
description: Identity and access management with single sign-on.
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: keycloak
images:
  - ref: quay.io/keycloak/keycloak
    tag_pattern: "^(?<version>[0-9]+(?:\\.[0-9]+){0,2})(?:-[0-9]+)?$"
    note: The number after a version (26.5.3-0) is an image rebuild of the same release; nightly carries no version.
sources:
  - type: ghsa-package
    ecosystem: maven
    package: org.keycloak:keycloak-services
    note: Listed first because the reviewed global advisories correct typos found in some repository advisories.
  - type: ghsa-package
    ecosystem: maven
    package: org.keycloak:keycloak-model-jpa
  - type: ghsa-repo
    repo: keycloak/keycloak
match:
  strategy: package-ranges
curated: false
data_notes:
  - Advisories name Maven artifacts such as org.keycloak:keycloak-services, whose versions are the release versions, with one upper bound per supported line as separate entries (< 26.4.14, < 26.6.5, < 26.7.1).
  - The redhat CNA files Keycloak CVEs for "Red Hat build of Keycloak" with RPM-style entries; it is not a source.
  - GHSA-f8m4-v488-rmrm writes < 26.37.1 for the 26.7 line (patched 26.7.1); corrections/keycloak holds its hand correction.
