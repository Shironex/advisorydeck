# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: pocket-id
name: Pocket ID
category: auth
homepage: https://pocket-id.org
description: OIDC provider that signs users in with passkeys.
version_scheme: semver
branches:
  source: none
images:
  - ref: ghcr.io/pocket-id/pocket-id
    tag_pattern: "^v?(?<version>[0-9]+(?:\\.[0-9]+){0,2})(?:-distroless)?$"
    note: latest and next carry no version.
sources:
  - type: ghsa-repo
    repo: pocket-id/pocket-id
  - type: cve-cna
    assigner: GitHub_M
    vendor: pocket-id
    products: [pocket-id]
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Advisories name the Go module github.com/pocket-id/pocket-id/backend, whose versions are the release versions.
  - Most repository advisories have no CVE id.
  - Not listed on endoflife.date.
