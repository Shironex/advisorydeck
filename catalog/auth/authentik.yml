# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: authentik
name: authentik
category: auth
homepage: https://goauthentik.io
description: Identity provider with single sign-on (OAuth2, SAML, LDAP, RADIUS).
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: authentik
images:
  - ref: ghcr.io/goauthentik/server
    tag_pattern: "^(?<version>[0-9]{4}\\.[0-9]+(?:\\.[0-9]+)?(?:-rc[0-9]+)?)$"
    note: latest and gh- tags carry no version.
sources:
  - type: ghsa-repo
    repo: goauthentik/authentik
  - type: cve-cna
    assigner: GitHub_M
    vendor: goauthentik
    products: [authentik]
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Versions are year.month.patch (2026.8.2) and compare as numbers; the branch is year.month.
  - Repository advisories list one upper bound per supported line as separate entries (<= 2026.8.1, <= 2026.5.6, <= 2026.2.6); ingest reads them as one range per line.
