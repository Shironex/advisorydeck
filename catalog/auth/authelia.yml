# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: authelia
name: Authelia
category: auth
homepage: https://www.authelia.com
description: Single sign-on and two-factor authentication portal for reverse proxies.
version_scheme: semver
branches:
  source: none
images:
  - ref: docker.io/authelia/authelia
    tag_pattern: "^v?(?<version>[0-9]+(?:\\.[0-9]+){1,2})$"
    note: Branch and feature tags (master, feat-...) carry no release version.
  - ref: ghcr.io/authelia/authelia
    tag_pattern: "^v?(?<version>[0-9]+(?:\\.[0-9]+){1,2})$"
sources:
  - type: ghsa-repo
    repo: authelia/authelia
  - type: ghsa-package
    ecosystem: go
    package: github.com/authelia/authelia/v4
  - type: cve-cna
    assigner: GitHub_M
    vendor: authelia
    products: [authelia]
match:
  strategy: package-ranges
curated: false
data_notes:
  - Advisories name the Go module github.com/authelia/authelia/v4, whose versions are the release versions; an open lower bound starts at 4.0.0.
  - Some advisories give a single affected version next to its patch (4.39.15, patched 4.39.16), read as every version before the patch.
  - Not listed on endoflife.date.
