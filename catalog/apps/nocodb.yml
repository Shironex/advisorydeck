# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: nocodb
name: NocoDB
category: apps
homepage: https://nocodb.com
description: Spreadsheet-style interface on top of SQL databases.
version_scheme: semver
branches:
  source: none
images:
  - ref: docker.io/nocodb/nocodb
    tag_pattern: "^(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
    note: latest, -pre and test builds carry no release version.
sources:
  - type: ghsa-repo
    repo: nocodb/nocodb
  - type: ghsa-package
    ecosystem: npm
    package: nocodb
  - type: cve-cna
    assigner: GitHub_M
    vendor: nocodb
    products: [nocodb]
  - type: cve-cna
    assigner: VulnCheck
    vendor: nocodb
    products: [nocodb]
    note: VulnCheck files CVEs for repository advisories that have none; their references link the GHSA, so they join it as one advisory.
match:
  strategy: package-ranges
curated: false
data_notes:
  - Versions moved from 0.26x.y and 0.301.x to year.month.patch (2026.10.1, written with a leading zero as 2026.07.0); both compare correctly as numbers.
  - Most repository advisories have no CVE id on GitHub.
  - Not listed on endoflife.date.
