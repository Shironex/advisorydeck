# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: open-webui
name: Open WebUI
category: apps
homepage: https://openwebui.com
description: Self-hosted web interface for local and remote AI models.
version_scheme: semver
branches:
  source: none
images:
  - ref: ghcr.io/open-webui/open-webui
    tag_pattern: "^v?(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)(?:-(?:cuda|ollama|cuda126|slim))?$"
    note: main, cuda, ollama and git- tags carry no release version.
sources:
  - type: ghsa-repo
    repo: open-webui/open-webui
  - type: ghsa-package
    ecosystem: pip
    package: open-webui
  - type: cve-cna
    assigner: GitHub_M
    vendor: open-webui
    products: [open-webui]
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Repository advisories name the pip package open-webui (most), the image openwebui/open-webui under docker, or the npm package open-webui. The pip and docker entries share the release versions; the npm entries are not read.
  - Old huntr records say unspecified up to latest, which carries no range.
  - Not listed on endoflife.date.
