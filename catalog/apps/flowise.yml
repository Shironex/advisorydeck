# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: flowise
name: Flowise
category: apps
homepage: https://flowiseai.com
description: Visual builder for LLM apps and AI agents.
version_scheme: semver
branches:
  source: none
images:
  - ref: docker.io/flowiseai/flowise
    tag_pattern: "^(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
    note: latest, test and hotfix tags carry no release version.
upstream:
  status: archived
  since: '2026-08-13'
  note: The GitHub repository is archived, so no further releases or security fixes are expected. Plan a move to another tool.
sources:
  - type: ghsa-repo
    repo: FlowiseAI/Flowise
  - type: ghsa-package
    ecosystem: npm
    package: flowise
  - type: cve-cna
    assigner: GitHub_M
    vendor: FlowiseAI
    products: [Flowise]
  - type: cve-cna
    assigner: VulnCheck
    vendor: FlowiseAI
    products: [Flowise]
    note: VulnCheck files CVEs for repository advisories that have none; their references link the GHSA, so they join it as one advisory.
  - type: cve-cna
    assigner: VulnCheck
    vendor: Flowise
    products: [Flowise]
match:
  strategy: package-ranges
curated: false
data_notes:
  - Advisories name the npm packages flowise and flowise-components, released in lockstep with the same versions; the flowise entries are read.
  - The repository was archived in August 2026 (the date is the last push; GitHub does not publish when a repository was archived).
  - Not listed on endoflife.date.
