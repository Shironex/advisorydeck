# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: directus
name: Directus
category: apps
homepage: https://directus.io
description: Headless CMS and data platform on top of any SQL database.
version_scheme: semver
branches:
  source: none
images:
  - ref: docker.io/directus/directus
    tag_pattern: "^(?<version>[0-9]+(?:\\.[0-9]+){0,2})(?:-dhi)?$"
    note: latest carries no version; -dhi tags are hardened builds of the same release.
sources:
  - type: ghsa-repo
    repo: directus/directus
  - type: ghsa-package
    ecosystem: npm
    package: directus
    note: Claimed so that entries for @directus/api and other packages, which carry their own version line (32.x), are not read as Directus versions.
  - type: cve-cna
    assigner: GitHub_M
    vendor: directus
    products: [directus]
  - type: cve-cna
    assigner: VulnCheck
    vendor: directus
    products: [directus]
    note: VulnCheck files CVEs for repository advisories that have none; their references link the GHSA, so they join it as one advisory.
match:
  strategy: package-ranges
curated: false
data_notes:
  - Advisories name the npm package directus, whose versions are the release versions (12.x); @directus/api and the storage drivers have their own versions.
  - Not listed on endoflife.date.
