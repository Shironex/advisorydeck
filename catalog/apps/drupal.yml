# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: drupal
name: Drupal
category: apps
homepage: https://www.drupal.org
description: Content management system (Drupal core; contributed modules are not covered).
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: drupal
images:
  - ref: docker.io/library/drupal
    tag_pattern: "^(?<version>[0-9]+(?:\\.[0-9]+){0,2})(?:-php[0-9.]+)?(?:-(?:apache|fpm)(?:-(?:alpine[0-9.]*|trixie|bookworm))?)?$"
    note: Tags without a Drupal number (php8.5-fpm, apache) carry no version.
sources:
  - type: cve-cna
    assigner: drupal
    products: [Drupal core]
    note: Drupal is its own CNA. Contributed modules are filed under their own names with 7.x-1.22 style versions and are not this product.
  - type: vendor-page
    url: https://www.drupal.org/security
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Records list one entry per supported line (8.9.0 lessThan 10.6.19, 11.0.0 lessThan 11.3.19, 11.4.0 lessThan 11.4.10); the product is written Drupal core or Drupal Core.
