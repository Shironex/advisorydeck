# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: n8n
name: n8n
category: apps
homepage: https://n8n.io
description: Workflow automation platform.
version_scheme: semver
branches:
  source: none
images:
  - ref: docker.io/n8nio/n8n
    tag_pattern: "^(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)(?:-[0-9a-f]{7})?(?:-(?:pc|debian))?(?:-(?:amd64|arm64))?$"
    note: rc, nightly and next tags carry no release version.
sources:
  - type: ghsa-repo
    repo: n8n-io/n8n
  - type: ghsa-package
    ecosystem: npm
    package: n8n
  - type: cve-cna
    assigner: GitHub_M
    vendor: n8n-io
    products: [n8n]
  - type: cve-cna
    assigner: VulnCheck
    vendor: n8n-io
    products: [n8n]
    note: VulnCheck files CVEs for repository advisories that have none; their references link the GHSA, so they join it as one advisory.
  - type: cve-cna
    assigner: VulnCheck
    vendor: n8n
    products: [n8n]
match:
  strategy: package-ranges
curated: false
data_notes:
  - Advisories name the npm package n8n with one upper bound per supported line as separate entries (< 1.123.96, < 2.47.6, < 2.48.3, < 3.2.2); ingest reads them as one range per line.
  - Most repository advisories have no CVE id on GitHub; VulnCheck files one later, under the vendor n8n-io or n8n.
  - Not listed on endoflife.date.
