# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: wordpress
name: WordPress
category: apps
homepage: https://wordpress.org
description: Content management system (WordPress core; plugins and themes are not covered).
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: wordpress
images:
  - ref: docker.io/library/wordpress
    tag_pattern: "^(?<version>[0-9]+\\.[0-9]+(?:\\.[0-9]+)?)(?:-php[0-9.]+)?(?:-(?:apache|fpm|fpm-alpine))?$"
    note: beta, cli and latest tags carry no WordPress version.
sources:
  - type: ghsa-repo
    repo: WordPress/wordpress-develop
  - type: cve-cna
    assigner: Wordfence
    vendor: WordPress Foundation
    products: [WordPress]
  - type: cve-cna
    assigner: WPScan
    vendor: WordPress
    products: [WordPress]
  - type: cve-cna
    assigner: Patchstack
    vendor: WordPress
    products: [WordPress]
  - type: cve-cna
    assigner: Patchstack
    vendor: Automattic
    products: [WordPress]
  - type: vendor-page
    url: https://wordpress.org/news/category/security/
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Core advisories come from four CNAs; each writes the vendor its own way (WordPress Foundation, WordPress, Automattic), and the vendor and product filters keep out the thousands of plugin and theme CVEs the same CNAs file.
  - The hackerone records for WordPress give one range from 0 to the newest fix, or only unaffected entries, and are not a source.
  - Repository advisories list one hyphen range per supported line back to 4.7 (7.1.0 - 7.1.3) with the patched release per line.
  - A two-part version such as 7.1 is a release, but the matcher reads it as the 7.1 branch; the answer is then for the newest 7.1 release.
