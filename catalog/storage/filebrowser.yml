# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: filebrowser
name: File Browser
category: storage
homepage: https://filebrowser.org
description: Web file manager for a directory on your server.
version_scheme: semver
branches:
  source: none
images:
  - ref: docker.io/filebrowser/filebrowser
    tag_pattern: "^v(?<version>[0-9]+(?:\\.[0-9]+){0,2})(?:-s6)?(?:-(?:amd64|arm64|armv6|armv7))?(?:-s6)?$"
    note: latest and s6 carry no version.
upstream:
  status: archived
  since: '2026-09-01'
  note: The project is archived and its maintainers ship no further releases or security fixes. Plan a move to another file manager.
sources:
  - type: ghsa-repo
    repo: filebrowser/filebrowser
  - type: ghsa-package
    ecosystem: go
    package: github.com/filebrowser/filebrowser/v2
  - type: cve-cna
    assigner: GitHub_M
    vendor: filebrowser
    products: [filebrowser]
    note: The vendor filter keeps out gtsteffaniak/filebrowser, a separate fork with its own versions (1.5.2-stable).
  - type: cve-cna
    assigner: VulnCheck
    vendor: filebrowser
    products: [filebrowser]
match:
  strategy: package-ranges
curated: false
data_notes:
  - Advisories name the Go module github.com/filebrowser/filebrowser/v2, whose versions are the release versions. Since the archive, advisories give an upper bound with no patched version (<= 2.63.23).
  - Archived on GitHub; the README says no further releases or security fixes (2026-09-01).
  - Not listed on endoflife.date.
