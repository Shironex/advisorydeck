# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: paperless-ngx
name: Paperless-ngx
category: storage
homepage: https://docs.paperless-ngx.com
description: Document management system that scans, indexes and archives paper documents.
version_scheme: semver
branches:
  source: none
images:
  - ref: ghcr.io/paperless-ngx/paperless-ngx
    tag_pattern: "^(?<version>[0-9]+(?:\\.[0-9]+){0,2})$"
    note: latest, dev and branch-named tags carry no version.
sources:
  - type: ghsa-repo
    repo: paperless-ngx/paperless-ngx
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Repository advisories name the package paperless-ngx (sometimes misspelled) or leave it empty. A few write the range in prose or with an en dash between two versions and cannot be read.
  - No repository advisory has a CVE id.
  - Not listed on endoflife.date.
