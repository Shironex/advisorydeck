# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: immich
name: Immich
category: storage
homepage: https://immich.app
description: Self-hosted photo and video library.
version_scheme: semver
branches:
  source: none
images:
  - ref: ghcr.io/immich-app/immich-server
    tag_pattern: "^v(?<version>[0-9]+(?:\\.[0-9]+){0,2}(?:-rc\\.[0-9]+)?)$"
    note: release, commit and pull request tags carry no release version.
sources:
  - type: ghsa-repo
    repo: immich-app/immich
  - type: cve-cna
    assigner: GitHub_M
    vendor: immich-app
    products: [immich]
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Repository advisories name immich-app/immich or immich under other, immich-server under docker or an empty ecosystem, and sometimes npm packages (@immich/server, @immich/cli) that release in lockstep.
  - Versions carry a leading v (v3.3.6).
  - About two thirds of the advisories have no CVE id.
  - Not listed on endoflife.date.
