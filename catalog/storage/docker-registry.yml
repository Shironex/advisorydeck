# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: docker-registry
name: Docker Registry (Distribution)
category: storage
homepage: https://distribution.github.io/distribution/
description: The open source container image registry (CNCF Distribution), the registry image.
version_scheme: semver
branches:
  source: none
images:
  - ref: docker.io/library/registry
    tag_pattern: "^(?<version>[0-9]+(?:\\.[0-9]+){0,2}(?:-(?:alpha|beta|rc)\\.[0-9]+)?)$"
    note: latest carries no version.
sources:
  - type: ghsa-repo
    repo: distribution/distribution
  - type: ghsa-package
    ecosystem: go
    package: github.com/distribution/distribution/v3
  - type: ghsa-package
    ecosystem: go
    package: github.com/docker/distribution
  - type: cve-cna
    assigner: GitHub_M
    vendor: distribution
    products: [distribution]
match:
  strategy: package-ranges
curated: false
data_notes:
  - Advisories name github.com/distribution/distribution/v3 (3.x) or github.com/docker/distribution (2.x); module versions equal release versions. Some write lines as x versions (<= 3.0.x, <= 2.8.x), which cannot be read.
  - Few advisories a year.
  - Not listed on endoflife.date.
