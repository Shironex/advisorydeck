# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: seaweedfs
name: SeaweedFS
category: storage
homepage: https://seaweedfs.com
description: Distributed object and file storage with an S3 API.
version_scheme: calver
branches:
  source: none
images:
  - ref: docker.io/chrislusf/seaweedfs
    tag_pattern: "^(?<version>[0-9]+\\.[0-9]+)(?:_large_disk)?(?:_full|_rocksdb|_foundationdb)?$"
    note: Build variants (4.54_large_disk_full) share the release version; latest and dev carry no version.
sources:
  - type: ghsa-repo
    repo: seaweedfs/seaweedfs
  - type: ghsa-package
    ecosystem: go
    package: github.com/seaweedfs/seaweedfs
  - type: cve-cna
    assigner: GitHub_M
    vendor: seaweedfs
    products: [seaweedfs]
  - type: cve-cna
    assigner: VulnCheck
    vendor: seaweedfs
    products: [seaweedfs]
match:
  strategy: package-ranges
curated: false
data_notes:
  - Releases are two-part (3.97, 4.41) and each is a release, not a branch, so the scheme is calver, where every version is exact.
  - Many advisories give an upper bound with no patched version (<= 4.47) or prose (<= 4.47 (the latest release), plus master.), which cannot be read.
  - Most repository advisories have no CVE id.
  - Not listed on endoflife.date.
