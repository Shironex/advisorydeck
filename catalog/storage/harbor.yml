# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: harbor
name: Harbor
category: storage
homepage: https://goharbor.io
description: Container image registry with scanning, signing and replication.
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: harbor
images:
  - ref: docker.io/goharbor/harbor-core
    tag_pattern: "^v(?<version>[0-9]+\\.[0-9]+\\.[0-9]+(?:-rc[0-9]+)?)(?:-(?:amd64|arm64))?$"
    note: Harbor runs as several images (harbor-core, harbor-portal, registry-photon) with one version; -dev tags carry no release version.
sources:
  - type: ghsa-repo
    repo: goharbor/harbor
  - type: ghsa-package
    ecosystem: go
    package: github.com/goharbor/harbor
  - type: cve-cna
    assigner: certcc
    vendor: Harbor
    products: [Harbor]
  - type: cve-cna
    assigner: VulnCheck
    vendor: goharbor
    products: [harbor]
match:
  strategy: package-ranges
curated: false
data_notes:
  - Advisories name the Go module github.com/goharbor/harbor with one bounded entry per supported line (< 2.13.6, >= 2.14.0 < 2.14.5).
  - Most repository advisories have no CVE id.
