# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: dokploy
name: Dokploy
category: paas
homepage: https://dokploy.com
description: Self-hosted platform for deploying applications and databases with Docker.
version_scheme: semver
branches:
  source: none
images:
  - ref: docker.io/dokploy/dokploy
    tag_pattern: "^v?(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
    note: The installer runs this image; canary, feature and latest carry no version.
sources:
  - type: ghsa-repo
    repo: Dokploy/dokploy
  - type: cve-cna
    assigner: GitHub_M
    vendor: Dokploy
    products: [dokploy]
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Repository advisories name dokploy under the ecosystem other, empty, docker or npm, all on the same version line; ingest reads the non-npm entries when present.
  - Most advisories have no CVE id. Some have no patched version (<= 0.31.0, patched null) and are published without a fix.
  - Not listed on endoflife.date.
