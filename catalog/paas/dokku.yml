# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: dokku
name: Dokku
category: paas
homepage: https://dokku.com
description: Docker-powered mini platform as a service. Usually installed on the host.
version_scheme: semver
branches:
  source: none
images:
  - ref: docker.io/dokku/dokku
    tag_pattern: "^(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
    note: Most installs use the apt package; dokku version reports the same number.
sources:
  - type: ghsa-repo
    repo: dokku/dokku
  - type: cve-cna
    assigner: GitHub_M
    vendor: dokku
    products: [dokku]
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Repository advisories name the package dokku with one upper bound.
  - Not listed on endoflife.date.
