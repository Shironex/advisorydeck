# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: coolify
name: Coolify
category: paas
homepage: https://coolify.io
description: Self-hosted platform for deploying applications, databases and services.
version_scheme: semver
branches:
  source: none
images:
  - ref: ghcr.io/coollabsio/coolify
    tag_pattern: "^v?(?<version>[0-9]+\\.[0-9]+\\.[0-9]+(?:-beta\\.[0-9]+)?)$"
    note: The installer runs this image; the version is shown in the Coolify dashboard.
sources:
  - type: ghsa-repo
    repo: coollabsio/coolify
  - type: ghsa-package
    ecosystem: composer
    package: coollabsio/coolify
match:
  strategy: vendor-ranges
curated: true
tags: [coolify]
data_notes:
  - Versions are 4.0.0-beta.N prereleases; compare N numerically (semver prerelease rules do this).
  - Patched versions are written both with and without a leading v (v4.0.0-beta.474 and 4.0.0-beta.474).
  - Advisories are published in batches, often several on the same day.
  - Not listed on endoflife.date, so the catalog has no branch source.
