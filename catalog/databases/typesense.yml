# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: typesense
name: Typesense
category: databases
homepage: https://typesense.org
description: Search engine with typo tolerance.
version_scheme: calver
branches:
  source: none
images:
  - ref: docker.io/typesense/typesense
    tag_pattern: "^(?<version>[0-9]+\\.[0-9]+)(?:-(?:amd64|arm64))?$"
    note: Release candidate tags (31.0.rc25) and page-size variants carry no release version.
sources:
  - type: ghsa-repo
    repo: typesense/typesense
  - type: cve-cna
    assigner: GitHub_M
    vendor: typesense
    products: [typesense]
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Releases are two-part (29.1, 30.2) and each is a release, not a branch, so the scheme is calver, where every version is exact.
  - Repository advisories name the package typesense-server.
  - Not listed on endoflife.date.
