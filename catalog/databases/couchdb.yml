# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: couchdb
name: Apache CouchDB
category: databases
homepage: https://couchdb.apache.org
description: Document database with HTTP replication.
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: apache-couchdb
images:
  - ref: docker.io/library/couchdb
    tag_pattern: "^(?<version>[0-9]+(?:\\.[0-9]+){0,2})(?:\\.[0-9]+)?(?:-nouveau)?$"
    note: Image rebuilds add a fourth number (3.5.2.1); only the release version is read.
sources:
  - type: cve-cna
    assigner: apache
    products: [Apache CouchDB]
    note: The Apache CNA files every ASF project; the product name keeps only CouchDB.
  - type: vendor-page
    url: https://docs.couchdb.org/en/stable/cve/index.html
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Records give one range from 0 to the fixing release (0 lessThan 3.5.3).
