# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: postgresql
name: PostgreSQL
category: databases
homepage: https://www.postgresql.org
description: Open source relational database.
version_scheme: pg
branches:
  source: endoflife
  endoflife_slug: postgresql
images:
  - ref: docker.io/library/postgres
    tag_pattern: "^(?<version>[0-9]+(?:\\.[0-9]+)?(?:(?:beta|rc)[0-9]+)?)(?:-[a-z].*)?$"
sources:
  - type: cve-cna
    assigner: PostgreSQL
    products: [PostgreSQL]
    note: PostgreSQL is its own CNA; records list one affected entry per supported branch.
  - type: vendor-page
    url: https://www.postgresql.org/support/security/
    note: Lists every CVE with affected and fixed versions; cross-check and note trigger only.
match:
  strategy: vendor-ranges
curated: true
tags: [coolify-database]
data_notes:
  - CNA records set vendor to n/a and versionType to rpm; the version field is the branch (17) and lessThan is the fix (17.12).
  - The oldest supported branch is written as version 0 with lessThan set to its fix (for example 0 lessThan 14.25).
