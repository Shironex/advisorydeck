# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: mysql
name: MySQL
category: databases
homepage: https://www.mysql.com
description: Relational database (MySQL Community Server).
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: mysql
images:
  - ref: docker.io/library/mysql
    tag_pattern: "^(?<version>[0-9]+(?:\\.[0-9]+){0,2})(?:-(?:oracle|oraclelinux[0-9]+|debian|bookworm))?$"
    note: lts, innovation and oracle tags carry no version.
sources:
  - type: cve-cna
    assigner: oracle
    products: [MySQL Server]
    note: Oracle is its own CNA and only files Oracle products. MySQL Cluster, MySQL Router, MySQL Shell and the connectors are filed under their own product names and are not this product.
  - type: vendor-page
    url: https://www.oracle.com/security-alerts/
    note: Quarterly Critical Patch Update advisories; cross-check only.
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Records list one affected entry per supported line as a hyphen range with no spaces and no lessThan (8.4.0-8.4.12, 9.7.0-9.7.3, 26.7.0-26.7.1); the second version is the last affected one.
  - Only supported lines are listed. An end of life innovation release (9.0 to 9.6) that is not listed reads as not affected, although Oracle does not say it was checked.
