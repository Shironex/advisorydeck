# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: surrealdb
name: SurrealDB
category: databases
homepage: https://surrealdb.com
description: Multi-model database (document, graph and key-value).
version_scheme: semver
branches:
  source: none
images:
  - ref: docker.io/surrealdb/surrealdb
    tag_pattern: "^v?(?<version>[0-9]+(?:\\.[0-9]+){0,2}(?:-(?:alpha|beta|rc)\\.[0-9]+)?)$"
    note: -dev and nightly tags are development builds and carry no release version.
sources:
  - type: ghsa-repo
    repo: surrealdb/surrealdb
  - type: ghsa-package
    ecosystem: rust
    package: surrealdb
  - type: cve-cna
    assigner: GitHub_M
    vendor: surrealdb
    products: [surrealdb]
  - type: cve-cna
    assigner: VulnCheck
    vendor: surrealdb
    products: [surrealdb]
    note: VulnCheck files CVEs for repository advisories that have none; their references link the GHSA, so they join it as one advisory.
match:
  strategy: package-ranges
curated: false
data_notes:
  - Advisories name the Rust crate surrealdb, whose versions are the release versions. Entries for surrealdb-core and other crates are only read when no surrealdb entry is present.
  - Almost every repository advisory has no CVE id on GitHub; VulnCheck files one later.
  - Not listed on endoflife.date.
