# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: dragonfly
name: Dragonfly
category: databases
homepage: https://www.dragonflydb.io
description: In-memory data store compatible with Redis and Memcached.
version_scheme: semver
branches:
  source: none
images:
  - ref: docker.dragonflydb.io/dragonflydb/dragonfly
    tag_pattern: "^v?(?<version>[0-9]+(?:\\.[0-9]+){0,2})(?:-(?:ubuntu|alpine))?$"
    note: latest and nightly tags carry no version.
sources:
  - type: ghsa-repo
    repo: dragonflydb/dragonfly
  - type: cve-cna
    assigner: GitHub_M
    vendor: dragonflydb
    products: [dragonfly]
    note: The vendor filter is required. dragonflyoss/dragonfly is an unrelated P2P distribution project with its own CVEs.
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Repository advisories leave the package name empty and often give no patched version.
  - Some bounds are two-part (< 1.40, <= 1.40). Read as a branch, <= 1.40 covers every 1.40 release; recent releases are tagged two-part as well (v2.1).
  - Not listed on endoflife.date.
