# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: memcached
name: Memcached
category: databases
homepage: https://memcached.org
description: In-memory key-value cache.
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: memcached
images:
  - ref: docker.io/library/memcached
    tag_pattern: "^(?<version>[0-9]+(?:\\.[0-9]+){0,2})(?:-(?:alpine[0-9.]*|trixie|bookworm|bullseye))?$"
    note: Variant tags without a number (alpine, trixie) carry no version.
sources:
  - type: cve-cna
    assigner: mitre
    vendor: memcached
    products: [memcached]
  - type: vendor-page
    url: https://github.com/memcached/memcached/wiki/ReleaseNotes
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Few advisories a year. VulDB also files CVEs that list single affected versions with no fix; they are not read.
