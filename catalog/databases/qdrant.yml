# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: qdrant
name: Qdrant
category: databases
homepage: https://qdrant.tech
description: Vector database and similarity search engine.
version_scheme: semver
branches:
  source: none
images:
  - ref: docker.io/qdrant/qdrant
    tag_pattern: "^v?(?<version>[0-9]+(?:\\.[0-9]+){0,2})(?:-(?:unprivileged|gpu-nvidia|gpu-amd))?$"
    note: master, dev and latest tags carry no version.
sources:
  - type: ghsa-repo
    repo: qdrant/qdrant
  - type: cve-cna
    assigner: GitHub_M
    vendor: qdrant
    products: [qdrant]
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Repository advisories name qdrant under the ecosystem "docker image / binary release" or the Rust crate qdrant; both use the release versions.
  - Few advisories a year.
  - Not listed on endoflife.date.
