# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: elasticsearch
name: Elasticsearch
category: databases
homepage: https://www.elastic.co/elasticsearch
description: Search and analytics engine.
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: elasticsearch
images:
  - ref: docker.io/library/elasticsearch
    tag_pattern: "^(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
  - ref: docker.elastic.co/elasticsearch/elasticsearch
    tag_pattern: "^(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)(?:-arm64|-amd64)?$"
    note: Elastic's own registry; the Docker Hub image is the official copy of it.
sources:
  - type: cve-cna
    assigner: elastic
    vendor: Elastic
    products: [Elasticsearch]
    note: The elastic CNA also files Kibana, Logstash, Beats and the agents under other product names.
  - type: vendor-page
    url: https://discuss.elastic.co/c/announcements/security-announcements/31
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Records give one entry per branch with lessThanOrEqual as the last affected release (8.10.0 lessThanOrEqual 8.19.23, 9.0.0 lessThanOrEqual 9.4.8).
