# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: redis
name: Redis
category: databases
homepage: https://redis.io
description: In-memory key-value data store.
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: redis
images:
  - ref: docker.io/library/redis
    tag_pattern: "^(?<version>[0-9]+(?:\\.[0-9]+){0,2}(?:-rc[0-9]+)?)(?:-[a-z].*)?$"
sources:
  - type: ghsa-repo
    repo: redis/redis
  - type: cve-cna
    assigner: GitHub_M
    vendor: redis
    products: [redis]
    note: CVE records for Redis are assigned by GitHub from the repo advisories and often carry a usable range when the advisory does not.
match:
  strategy: vendor-ranges
curated: true
tags: [coolify-database]
data_notes:
  - Repo advisories name the package redis-server with no ecosystem, and often use All or TBD as the affected and patched versions.
  - The matching CVE record writes the range inside the version field (for example "< 8.2.2").
