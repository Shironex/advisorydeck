# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: apache-httpd
name: Apache HTTP Server
category: proxies
homepage: https://httpd.apache.org
description: Web server and reverse proxy (httpd). Also inside many PHP images.
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: apache-http-server
images:
  - ref: docker.io/library/httpd
    tag_pattern: "^(?<version>[0-9]+(?:\\.[0-9]+){0,2})(?:-(?:alpine|trixie|bookworm|bullseye)[0-9.]*)?$"
sources:
  - type: cve-cna
    assigner: apache
    products: [Apache HTTP Server]
    note: The Apache CNA files every ASF project; the product name keeps only httpd.
  - type: vendor-page
    url: https://httpd.apache.org/security/vulnerabilities_24.html
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Records give the 2.4 line as one entry with lessThanOrEqual as the last affected release (2.4.30 lessThanOrEqual 2.4.70).
  - Windows builds by Apache Lounge are filed by another CNA under another product name and do not apply to the image.
