# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: traefik
name: Traefik
category: proxies
homepage: https://traefik.io/traefik/
description: Reverse proxy and load balancer with automatic service discovery.
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: traefik
images:
  - ref: docker.io/library/traefik
    tag_pattern: "^v?(?<version>[0-9]+(?:\\.[0-9]+){0,2}(?:-rc\\.[0-9]+)?)(?:-[a-z].*)?$"
    note: Tags exist with and without a leading v (v3.7.19 and 3.7.19), plus codename tags that carry no version.
sources:
  - type: ghsa-repo
    repo: traefik/traefik
  - type: ghsa-package
    ecosystem: go
    package: github.com/traefik/traefik/v3
  - type: ghsa-package
    ecosystem: go
    package: github.com/traefik/traefik/v2
match:
  strategy: package-ranges
curated: true
tags: [coolify-proxy]
data_notes:
  - GHSA ranges carry a leading v (v3.7.18); strip it before comparing.
  - Many recent repo advisories have no CVE id, so the GHSA id is the cluster id.
