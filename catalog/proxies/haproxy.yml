# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: haproxy
name: HAProxy
category: proxies
homepage: https://www.haproxy.org
description: TCP and HTTP load balancer and proxy (community edition).
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: haproxy
images:
  - ref: docker.io/library/haproxy
    tag_pattern: "^(?<version>[0-9]+(?:\\.[0-9]+){0,2})(?:-(?:alpine|trixie|bookworm|bullseye)[0-9.]*)?$"
    note: Development tags (3.5-dev12) and lts carry no release version.
sources:
  - type: cve-cna
    assigner: mitre
    vendor: HAProxy
    products: [HAProxy]
    note: MITRE assigns HAProxy CVEs. Coverage is partial; many HAProxy issues are only published as distro records.
  - type: vendor-page
    url: https://www.haproxy.org/news.html
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Records list one entry per branch with lessThan as the fix (3.0.0 lessThan 3.0.30, 3.2.0 lessThan 3.2.26).
  - Partial coverage. Many HAProxy fixes only appear as Red Hat or distro records, which the catalog does not read; HAProxy Enterprise versions (3.0r1-362) are a different line.
