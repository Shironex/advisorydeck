# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: nginx-proxy-manager
name: Nginx Proxy Manager
category: proxies
homepage: https://nginxproxymanager.com
description: Web interface for NGINX reverse proxy hosts with Let's Encrypt certificates.
version_scheme: semver
branches:
  source: none
images:
  - ref: docker.io/jc21/nginx-proxy-manager
    tag_pattern: "^(?<version>[0-9]+(?:\\.[0-9]+){0,2})$"
    note: latest and v3 tags carry no release version.
sources:
  - type: cve-cna
    assigner: VulnCheck
    vendor: NginxProxyManager
    products: [nginx-proxy-manager]
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - The project publishes no advisories of its own; only third-party CNAs file CVEs. VulnCheck ranges run from 0 to the newest release at the time (0 lessThanOrEqual 2.16.0) and usually name no fix.
  - VulDB also files CVEs that list single affected versions; they are not read.
  - Not listed on endoflife.date.
