# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: code-server
name: code-server
category: devtools
homepage: https://coder.com/docs/code-server
description: VS Code in the browser, run on your own server.
version_scheme: semver
branches:
  source: none
images:
  - ref: docker.io/codercom/code-server
    tag_pattern: "^(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)(?:-(?:[0-9]+|fedora|trixie|bookworm|debian|resolute|noble|jammy|focal|ubuntu|tumbleweed|opensuse))?$"
    note: Distribution tags without a number (fedora, noble) carry no version; the number after a version (4.145.2-39) is the Fedora release.
sources:
  - type: ghsa-repo
    repo: coder/code-server
  - type: ghsa-package
    ecosystem: npm
    package: code-server
match:
  strategy: package-ranges
curated: false
data_notes:
  - Advisories name the npm package code-server, whose versions are the release versions.
  - Few advisories a year.
  - Not listed on endoflife.date.
