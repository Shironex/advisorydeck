# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: gitlab
name: GitLab
category: devtools
homepage: https://about.gitlab.com
description: DevOps platform with Git hosting, CI/CD and registry (Community and Enterprise Edition).
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: gitlab
images:
  - ref: docker.io/gitlab/gitlab-ce
    tag_pattern: "^(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)-ce\\.[0-9]+$"
  - ref: docker.io/gitlab/gitlab-ee
    tag_pattern: "^(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)-ee\\.[0-9]+$"
sources:
  - type: cve-cna
    assigner: GitLab
    vendor: GitLab
    products: [GitLab]
    note: The GitLab CNA also publishes other vendors' products (Wireshark and others) and GitLab tools under other names (GitLab AI Gateway, GitLab Runner).
  - type: vendor-page
    url: https://about.gitlab.com/releases/categories/releases/
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Records cover CE and EE together; an issue in an EE-only feature is also reported for CE versions.
  - One entry per supported branch, the oldest written from an old release (7.0 lessThan 18.11.13, 19.0 lessThan 19.0.10).
  - Image tags end in -ce.0 or -ee.0.
