# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: coder
name: Coder
category: devtools
homepage: https://coder.com
description: Self-hosted cloud development environments.
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: coder
images:
  - ref: ghcr.io/coder/coder
    tag_pattern: "^v(?<version>[0-9]+\\.[0-9]+\\.[0-9]+(?:-rc\\.[0-9]+)?)(?:-(?:amd64|arm64|armv7))?$"
    note: latest and main tags carry no version.
sources:
  - type: ghsa-repo
    repo: coder/coder
  - type: ghsa-package
    ecosystem: go
    package: github.com/coder/coder/v2
  - type: cve-cna
    assigner: GitHub_M
    vendor: coder
    products: [coder]
  - type: cve-cna
    assigner: VulnCheck
    vendor: coder
    products: [coder]
    note: VulnCheck files CVEs for repository advisories that have none; their references link the GHSA, so they join it as one advisory.
match:
  strategy: package-ranges
curated: false
data_notes:
  - Advisories name the Go module github.com/coder/coder/v2 with one bounded entry per supported line (>= 2.37.0, < 2.37.3) and one range for the extended support line (>= 2.30.0, < 2.34.12).
  - About half of the repository advisories have no CVE id on GitHub.
