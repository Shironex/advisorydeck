# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: podman
name: Podman
category: containers
homepage: https://podman.io
description: Daemonless container engine. Installed on the host, not run from an image.
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: podman
images: []
sources:
  - type: ghsa-repo
    repo: podman-container-tools/podman
    note: The repository moved from containers/podman; the old path redirects.
  - type: ghsa-package
    ecosystem: go
    package: go.podman.io/podman/v6
  - type: ghsa-package
    ecosystem: go
    package: github.com/containers/podman/v5
  - type: ghsa-package
    ecosystem: go
    package: github.com/containers/podman
  - type: cve-cna
    assigner: GitHub_M
    vendor: podman-container-tools
    products: [podman]
  - type: cve-cna
    assigner: GitHub_M
    vendor: containers
    products: [podman]
match:
  strategy: package-ranges
curated: false
data_notes:
  - The Go module moved at v6 (go.podman.io/podman/v6); 5.x advisories name github.com/containers/podman/v5 or the module path without a major suffix. Module versions equal release versions and carry a leading v.
  - Podman Desktop is a separate project (podman-desktop) and is not this product.
  - The version comes from podman --version on the host.
