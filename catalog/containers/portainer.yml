# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: portainer
name: Portainer
category: containers
homepage: https://www.portainer.io
description: Web UI for managing Docker, Swarm and Kubernetes (Community Edition).
version_scheme: semver
branches:
  source: none
images:
  - ref: docker.io/portainer/portainer-ce
    tag_pattern: "^(?<version>[0-9]+(?:\\.[0-9]+){1,2})(?:-linux-[a-z0-9]+)?(?:-alpine)?$"
    note: lts, sts, latest and alpine are floating tags without a version.
sources:
  - type: ghsa-repo
    repo: portainer/portainer
  - type: cve-cna
    assigner: GitHub_M
    vendor: portainer
    products: [portainer]
match:
  strategy: vendor-ranges
curated: false
data_notes:
  - Repository advisories name only the Go module github.com/portainer/portainer, whose versions equal the release versions; one entry per line (>= 2.39.0, < 2.39.6 and >= 2.40.0, < 2.45.0).
  - Some entries for the LTS line have no patched version. A closed range (>= 2.39.0, <= 2.39.8) stays closed, an open one (>= 2.39.0) next to a later line is read as every 2.39 release.
  - The CVE records are filed by GitHub and by TuranSec (Portainer CE); only the GitHub ones are read.
  - Not listed on endoflife.date.
