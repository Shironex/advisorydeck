# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: runc
name: runc
category: containers
homepage: https://github.com/opencontainers/runc
description: Low-level OCI container runtime used by containerd and Docker. Installed on the host.
version_scheme: semver
branches:
  source: none
images: []
sources:
  - type: ghsa-repo
    repo: opencontainers/runc
  - type: ghsa-package
    ecosystem: go
    package: github.com/opencontainers/runc
  - type: cve-cna
    assigner: GitHub_M
    vendor: opencontainers
    products: [runc]
match:
  strategy: package-ranges
curated: false
data_notes:
  - Advisories name the Go module github.com/opencontainers/runc with one entry per branch, including release candidates (>= 1.4.0-rc.1, < 1.4.4). One older shape lists upper bounds only, the newest a release candidate (<=1.3.5,<=1.4.2,<=1.5.0-rc.2); that branch is read from its lowest prerelease (1.5.0-0).
  - The version comes from runc --version on the host (or docker version), never from an image tag.
  - Not listed on endoflife.date.
