# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: containerd
name: containerd
category: containers
homepage: https://containerd.io
description: Container runtime under Docker Engine and Kubernetes. Installed on the host, not run from an image.
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: containerd
images: []
sources:
  - type: ghsa-repo
    repo: containerd/containerd
  - type: ghsa-package
    ecosystem: go
    package: github.com/containerd/containerd/v2
  - type: ghsa-package
    ecosystem: go
    package: github.com/containerd/containerd
  - type: cve-cna
    assigner: GitHub_M
    vendor: containerd
    products: [containerd]
match:
  strategy: package-ranges
curated: false
data_notes:
  - Advisories name the Go modules github.com/containerd/containerd/v2 (2.x) and github.com/containerd/containerd (1.x); module versions equal release versions. Ranges list one bounded pair per branch in one string.
  - The version comes from containerd --version on the host (or docker version), never from an image tag.
