# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: k3s
name: K3s
category: containers
homepage: https://k3s.io
description: Lightweight Kubernetes distribution.
version_scheme: semver
branches:
  source: none
images:
  - ref: docker.io/rancher/k3s
    tag_pattern: "^v(?<version>[0-9]+\\.[0-9]+\\.[0-9]+(?:-rc[0-9]+)?)-k3s[0-9]+$"
    note: The -k3s1 suffix is the K3s build of a Kubernetes release; advisories write it as build metadata (1.35.3+k3s1), which does not change the order, so only the Kubernetes version is read.
sources:
  - type: ghsa-repo
    repo: k3s-io/k3s
  - type: ghsa-package
    ecosystem: go
    package: github.com/k3s-io/k3s
  - type: cve-cna
    assigner: GitHub_M
    vendor: k3s-io
    products: [k3s]
match:
  strategy: package-ranges
curated: false
data_notes:
  - Versions carry the K3s build as build metadata (v1.35.3+k3s1); one entry per supported Kubernetes line.
  - Few advisories a year; Kubernetes advisories that also affect K3s are filed under kubernetes.
  - Not listed on endoflife.date.
