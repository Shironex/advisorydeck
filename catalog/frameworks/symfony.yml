# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: symfony
name: Symfony
category: frameworks
homepage: https://symfony.com
description: PHP framework and set of reusable components.
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: symfony
images: []
sources:
  - type: ghsa-package
    ecosystem: composer
    package: symfony/symfony
match:
  strategy: package-ranges
curated: false
data_notes:
  - Advisories name the component (symfony/http-foundation) and the full framework package symfony/symfony with the same versions; ingest reads symfony/symfony.
