# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: spring-boot
name: Spring Boot
category: frameworks
homepage: https://spring.io/projects/spring-boot
description: Java framework for stand-alone Spring applications.
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: spring-boot
images: []
sources:
  - type: ghsa-package
    ecosystem: maven
    package: org.springframework.boot:spring-boot
  - type: ghsa-package
    ecosystem: maven
    package: org.springframework.boot:spring-boot-autoconfigure
  - type: ghsa-package
    ecosystem: maven
    package: org.springframework.boot:spring-boot-actuator
  - type: ghsa-package
    ecosystem: maven
    package: org.springframework.boot:spring-boot-actuator-autoconfigure
match:
  strategy: package-ranges
curated: false
data_notes:
  - Advisories name the Maven artifacts of Spring Boot, which share one version.
  - Lines out of open-source support are listed without a patched version (fixes for them ship only in commercial releases), so they read affected.
