# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: spring-framework
name: Spring Framework
category: frameworks
homepage: https://spring.io/projects/spring-framework
description: Java application framework (Spring MVC, WebFlux and the core container).
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: spring-framework
images: []
sources:
  - type: ghsa-package
    ecosystem: maven
    package: org.springframework:spring-core
  - type: ghsa-package
    ecosystem: maven
    package: org.springframework:spring-beans
  - type: ghsa-package
    ecosystem: maven
    package: org.springframework:spring-context
  - type: ghsa-package
    ecosystem: maven
    package: org.springframework:spring-expression
  - type: ghsa-package
    ecosystem: maven
    package: org.springframework:spring-web
  - type: ghsa-package
    ecosystem: maven
    package: org.springframework:spring-webmvc
  - type: ghsa-package
    ecosystem: maven
    package: org.springframework:spring-webflux
  - type: ghsa-package
    ecosystem: maven
    package: org.springframework:spring-messaging
match:
  strategy: package-ranges
curated: false
data_notes:
  - Advisories name the Maven artifacts of Spring Framework, which share one version.
  - Lines out of open-source support are listed without a patched version (fixes for them ship only in commercial releases), so they read affected. Old lines use the .RELEASE suffix (5.2.25.RELEASE).
