# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: angular
name: Angular
category: frameworks
homepage: https://angular.dev
description: Web framework for TypeScript applications.
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: angular
images: []
sources:
  - type: ghsa-package
    ecosystem: npm
    package: '@angular/core'
  - type: ghsa-package
    ecosystem: npm
    package: '@angular/common'
  - type: ghsa-package
    ecosystem: npm
    package: '@angular/platform-server'
match:
  strategy: package-ranges
curated: false
data_notes:
  - The framework packages share one version, so advisories on @angular/core, @angular/common and @angular/platform-server all read as Angular. @angular/ssr follows the Angular CLI versions (20.3.43 next to framework 20.3.35) and is not included.
  - Advisories often list the lines out of support (<= 19.2.25) with no patched version, since no fix was published for them.
