# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: laravel
name: Laravel
category: frameworks
homepage: https://laravel.com
description: PHP web framework.
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: laravel
images: []
sources:
  - type: ghsa-package
    ecosystem: composer
    package: laravel/framework
match:
  strategy: package-ranges
curated: false
data_notes:
  - Advisories name the Composer package laravel/framework with one range per supported major.
