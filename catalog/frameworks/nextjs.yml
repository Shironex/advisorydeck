# yaml-language-server: $schema=../../schemas/v1/product.schema.json
slug: nextjs
name: Next.js
category: frameworks
homepage: https://nextjs.org
description: React framework for full-stack web apps.
version_scheme: semver
branches:
  source: endoflife
  endoflife_slug: nextjs
images: []
sources:
  - type: ghsa-package
    ecosystem: npm
    package: next
  - type: ghsa-repo
    repo: vercel/next.js
    note: Repository advisories are less exact than the reviewed global ones (a bare 16.3.0 for >= 16.3.0, < 16.3.8), so the global record comes first.
match:
  strategy: package-ranges
curated: false
data_notes:
  - Repository and global advisories name the npm package next; one advisory often lists a lower bound per supported line with a list of patched versions, paired per line by ingest.
  - Canary prereleases (16.4.0-canary.12) appear as lower bounds.
