# gitleaks configuration: the default rules, plus one allowlist.
title = "advisorydeck"

[extend]
useDefault = true

# data/ is written by ingest from public advisories. Their descriptions quote proof-of-concept
# requests with example keys and passwords; they are third-party text, not secrets of this repo.
[[allowlists]]
description = "public advisory text written by ingest"
paths = ['''^data/''']
