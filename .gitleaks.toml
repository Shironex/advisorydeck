# gitleaks configuration: the default rules, plus one allowlist.
title = "advisorydeck"

[extend]
useDefault = true

# data/ is written by ingest from public advisories. Their descriptions quote proof-of-concept
# requests with example keys and passwords; they are third-party text, not secrets of this repo.
[[allowlists]]
description = "public advisory text written by ingest"
paths = ['''^data/''']

# GitHub advisory ids (GHSA-xxxx-xxxx-xxxx) are public identifiers. Next to a product name with
# "key" or "auth" in it (keycloak, authentik) the generic rule reads them as API keys.
[[allowlists]]
description = "GitHub security advisory ids"
regexTarget = "secret"
regexes = ['''^GHSA(-[23456789cfghjmpqrvwx]{4}){3}$''']
