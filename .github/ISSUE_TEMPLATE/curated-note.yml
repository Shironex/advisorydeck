name: Curated note
description: Propose or request a self-hoster note for an advisory.
title: 'note: <advisory id> <product>'
labels: [curated-note, 'area:notes']
body:
  - type: markdown
    attributes:
      value: |
        A curated note says whether an advisory touches a typical self-hosted setup and what to do. See docs/adding-a-note.md. You can also open a pull request with the note directly.
  - type: input
    id: advisory
    attributes:
      label: Advisory id
      description: The CVE id, or the GHSA id when there is no CVE.
      placeholder: CVE-2026-120154
    validations:
      required: true
  - type: input
    id: products
    attributes:
      label: Products
      description: Catalog slugs, comma separated.
      placeholder: postgresql
    validations:
      required: true
  - type: input
    id: vendor-advisory
    attributes:
      label: Vendor advisory link
    validations:
      required: true
  - type: dropdown
    id: exposure
    attributes:
      label: Is a default self-hosted setup exposed?
      options:
        - default-exposed
        - conditional
        - not-default
        - unknown
    validations:
      required: true
  - type: textarea
    id: assumptions
    attributes:
      label: Assumptions
      description: The setup your judgement assumes. Required unless exposure is unknown or default-exposed.
  - type: textarea
    id: actions
    attributes:
      label: What to do
      description: The exact steps (backup, upgrade, commands, config changes).
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Checks
      options:
        - label: I read the vendor advisory and wrote this myself (no copied posts).
          required: true
        - label: I agree that the note is published under CC-BY-4.0.
          required: true
