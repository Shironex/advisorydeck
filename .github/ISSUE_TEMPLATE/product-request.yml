name: Product request
description: Ask for a product to be added to the catalog.
title: 'product: <name>'
labels: [product-request, 'area:catalog']
body:
  - type: markdown
    attributes:
      value: |
        The catalog stays small on purpose. A product fits when self-hosters commonly run it and its advisories are published somewhere machine-readable. See docs/adding-a-product.md.
  - type: input
    id: name
    attributes:
      label: Product
      placeholder: Valkey
    validations:
      required: true
  - type: input
    id: homepage
    attributes:
      label: Homepage
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why self-hosters need it
      description: For example, it is a Coolify one-click service, or a common dependency.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Where its advisories are published
      description: GitHub security advisories, a CNA writing CVE records, an OSV ecosystem, a vendor RSS feed or page.
    validations:
      required: true
  - type: input
    id: images
    attributes:
      label: Official container images
      placeholder: docker.io/valkey/valkey
