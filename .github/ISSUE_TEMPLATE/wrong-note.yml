name: Wrong note report
description: A curated note is wrong, outdated or misleading.
title: 'wrong note: <advisory id>'
labels: ['type:fix', 'area:notes']
body:
  - type: markdown
    attributes:
      value: |
        Thanks: a wrong note is the worst failure this project can have. A disputed note has its exposure label hidden until it is resolved.
  - type: input
    id: advisory
    attributes:
      label: Advisory id
      placeholder: CVE-2026-120154
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong
      description: Quote the part of the note and say why it is wrong for your setup.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Links to the vendor advisory, a fix commit or a reproduction. Do not post secrets or details of a live exploitable system.
    validations:
      required: true
