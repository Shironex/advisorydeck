# yaml-language-server: $schema=../../schemas/v1/image-config.schema.json
version: 1
feed:
  url: https://feed.example.org/api/v1/
  poll_interval: 30m
products:
  - slug: postgresql
    version: '17'
  - slug: traefik
    version: 3.7.19
  - slug: coolify
    version: 4.0.0-beta.474
min_severity: high
mode: digest
digest:
  time: '08:00'
  timezone: Europe/Berlin
channels:
  - type: discord
    url_env: DISCORD_WEBHOOK_URL
    name: ops
  - type: webhook
    url_env: GENERIC_WEBHOOK_URL
state_path: /data/state.json
