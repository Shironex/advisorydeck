version: '2'
linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    errcheck:
      # Writing CLI output to stdout or stderr has no useful failure handling.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Test helpers read repository fixtures by path on purpose.
      - path: internal/contracttest/
        linters: [gosec]
        text: G304
formatters:
  enable:
    - gofmt
